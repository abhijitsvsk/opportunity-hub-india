name: Keep Supabase Alive

on:
  schedule:
    # Ping every 4 days at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 */4 * *'
  workflow_dispatch:
    # Manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent free-tier pausing
        run: |
          echo "Pinging Supabase at $(date -u)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/opportunities?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Supabase ping failed with HTTP $STATUS"
            exit 1
          fi
          echo "✅ Supabase is alive!"
