name: Dead Link Reaper

on:
  schedule:
    # Run daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of opportunities to check'
        required: false
        default: '300'

jobs:
  reap-dead-links:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'scraper/package-lock.json'

      - name: Install dependencies
        working-directory: ./scraper
        run: npm ci

      - name: Run Dead Link Reaper
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node reaper.js --live --limit=${{ github.event.inputs.limit || '300' }}
