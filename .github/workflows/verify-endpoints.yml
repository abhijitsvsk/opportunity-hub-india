name: Verify Endpoints from Datacenter IP

on:
  push:
    paths:
      - '.github/workflows/verify-endpoints.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Endpoints
        run: |
          mkdir -p ./endpoint-results
          curl -s -w "\nHTTP_CODE:%{http_code}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.hackerrank.com/rest/contests/upcoming?offset=0&limit=3" > ./endpoint-results/hackerrank.txt
          curl -s -w "\nHTTP_CODE:%{http_code}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.hackerearth.com/chrome-extension/events/" > ./endpoint-results/hackerearth.txt
          curl -s -w "\nHTTP_CODE:%{http_code}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.codechef.com/api/list/contests/all?sort_by=START&sorting_order=asc&offset=0&mode=all" > ./endpoint-results/codechef.txt
          curl -s -w "\nHTTP_CODE:%{http_code}" "https://codeforces.com/api/contest.list?gym=false" > ./endpoint-results/codeforces.txt

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./endpoint-results
          git commit -m "chore: save endpoint verification results from CI runner" || exit 0
          git push
