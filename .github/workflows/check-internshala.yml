name: Check Internshala

on:
  push:
    paths:
      - '.github/workflows/check-internshala.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Internshala
        run: |
          CODE=$(curl -s -o /tmp/ishala.html -w "%{http_code}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://internshala.com/internships/computer-science-internship/")
          echo "Internshala HTTP Code: $CODE"
          mkdir -p ./test-results
          echo "HTTP_CODE:$CODE" > ./test-results/internshala.txt
          head -n 20 /tmp/ishala.html >> ./test-results/internshala.txt
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add ./test-results
          git commit -m "chore: test internshala on CI" || exit 0
          git push
